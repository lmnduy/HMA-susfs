name: Build ksu_susfs (per-target patches)

on:
  workflow_dispatch:
    inputs:
      susfs_commit:
        description: "SUSFS commit (overrides upstream/susfs.env)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply pin overrides
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.susfs_commit }}" ]; then
            sed -i "s|^SUSFS_COMMIT=.*|SUSFS_COMMIT=${{ inputs.susfs_commit }}|" upstream/susfs.env
          fi
          cat upstream/susfs.env

      - name: Locate NDK (preinstalled on the runner)
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_HOME:-}"
          if [ -z "$NDK" ] || [ ! -x "$NDK/ndk-build" ]; then
            NDK="$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [ ! -x "$NDK/ndk-build" ]; then
            echo "::error::no usable NDK found under $ANDROID_HOME/ndk"
            exit 1
          fi
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "using NDK: $NDK"

      - name: Fetch pinned SUSFS
        run: |
          set -euo pipefail
          chmod +x scripts/fetch-susfs.sh scripts/overlay-device.sh cli/build-cli.sh patches/apply-all.sh
          ./scripts/fetch-susfs.sh "$GITHUB_WORKSPACE/.work/susfs"

      - name: Build
        run: |
          set -euo pipefail
          ./cli/build-cli.sh "$GITHUB_WORKSPACE/.work/susfs" "$GITHUB_WORKSPACE/out"

      - name: Verify commands
        run: |
          set -euo pipefail
          for c in add_sus_path_hide_from add_hidden_uid add_hidden_uid_from; do
            grep -q "$c" out/ksu_susfs || { echo "::error::missing $c"; exit 1; }
          done
          ls -l out/ksu_susfs

      - uses: actions/upload-artifact@v4
        with:
          name: ksu_susfs-per-target
          path: out/ksu_susfs
