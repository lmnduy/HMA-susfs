name: Build HMA-susfs (APK + Zygisk module)

on:
  workflow_dispatch:
    inputs:
      susfs_commit:
        description: "SUSFS commit (overrides upstream/susfs.env)"
        required: false
        type: string
      build_type:
        description: "Gradle variant (release or debug)"
        required: false
        default: "release"
        type: choice
        options:
          - release
          - debug

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WORK: ${{ github.workspace }}/.work
    steps:
      - uses: actions/checkout@v4

      - name: Apply pin overrides
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.susfs_commit }}" ]; then
            sed -i "s|^SUSFS_COMMIT=.*|SUSFS_COMMIT=${{ inputs.susfs_commit }}|" upstream/susfs.env
          fi
          cat upstream/susfs.env upstream/hma-oss.env

      - name: Prepare git metadata for HMA version derivation
        run: |
          set -euo pipefail
          # HMA-OSS derives versionCode from 'git rev-list refs/remotes/origin/master'.
          # The vendored tree lives inside this repo (no own .git), and this repo's
          # default branch is main, so create the ref HMA looks for.
          git update-ref refs/remotes/origin/master HEAD
          echo "origin/master count: $(git rev-list refs/remotes/origin/master --count)"
          git rev-parse --short HEAD

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Locate NDK (preinstalled on the runner)
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_HOME:-}"
          if [ -z "$NDK" ] || [ ! -x "$NDK/ndk-build" ]; then
            NDK="$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [ ! -x "$NDK/ndk-build" ]; then
            echo "::error::no usable NDK found under $ANDROID_HOME/ndk"
            exit 1
          fi
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "using NDK: $NDK"

      - name: Fetch pinned SUSFS
        run: |
          set -euo pipefail
          chmod +x scripts/fetch-susfs.sh scripts/overlay-device.sh cli/build-cli.sh patches/apply-all.sh
          ./scripts/fetch-susfs.sh "$WORK/susfs"

      - name: Build ksu_susfs (per-target patches)
        run: |
          set -euo pipefail
          ./cli/build-cli.sh "$WORK/susfs" "$WORK/out"

      - name: Overlay device assets into the vendored tree
        run: |
          set -euo pipefail
          ./scripts/overlay-device.sh "$GITHUB_WORKSPACE/hma-oss" "$WORK/out/ksu_susfs"

      - name: Build APK
        working-directory: ${{ github.workspace }}/hma-oss
        run: |
          set -euo pipefail
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon ":app:assemble${{ inputs.build_type == 'debug' && 'Debug' || 'Release' }}"

      - name: Build Zygisk module
        working-directory: ${{ github.workspace }}/hma-oss
        run: |
          set -euo pipefail
          rm -f zygote/src/main/assets/manager.apk
          rm -rf zygote/build/generated/source/signInfo
          # the module bundles the manager APK of the same variant; make sure a stale
          # one from another variant cannot be picked up
          rm -rf "$GITHUB_WORKSPACE/hma-oss/zygote/build/outputs/magisk"
          ./gradlew --no-daemon ":zygote:assemble${{ inputs.build_type == 'debug' && 'Debug' || 'Release' }}"

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p out
          VARIANT="${{ inputs.build_type == 'debug' && 'debug' || 'release' }}"
          find "$GITHUB_WORKSPACE/hma-oss/app/build/outputs/apk/$VARIANT" -name '*.apk' -exec cp -v {} out/ \;
          find "$GITHUB_WORKSPACE/hma-oss/zygote/build/outputs/magisk/$VARIANT" -name '*.zip' -exec cp -v {} out/ \;
          cp -v "$WORK/out/ksu_susfs" out/ksu_susfs
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: hma-susfs-apk-and-module
          path: out/*
